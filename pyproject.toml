[project]
name = "opticatalog"
version = "0.1.0"
description = "Analyse de données pour les boutiques d'optique"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.uv]
# Projet applicatif : pas de build/packaging à ce stade, uv gère seulement
# l'environnement et les dépendances. On lance via `uv run`.
package = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
